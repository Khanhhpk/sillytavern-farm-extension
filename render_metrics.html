<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendering Metrics Debug</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --text: #c9d1d9;
            --text-accent: #58a6ff;
            --border: #30363d;
            --btn: #238636;
            --btn-hover: #2ea043;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
        }
        h1 { color: var(--text-accent); font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .controls { margin-bottom: 20px; }
        button {
            background-color: var(--btn); color: white; border: 1px solid rgba(240,246,252,0.1);
            padding: 5px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;
        }
        button:hover { background-color: var(--btn-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
        th { background: #010409; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        .cmd-btn { background-color: #21262d; border-color: var(--border); }
        .cmd-btn:hover { background-color: #30363d; border-color: #8b949e; }
        
        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100;
        }
        .modal-content {
            background: var(--panel); border: 1px solid var(--border); width: 400px;
            margin: 100px auto; padding: 20px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .modal-content h3 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px; background: #0d1117; border: 1px solid var(--border);
            color: var(--text); border-radius: 4px; box-sizing: border-box;
        }
        .form-actions { text-align: right; margin-top: 20px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); margin-right: 10px; }
        .btn-cancel:hover { background: #30363d; }
    </style>
</head>
<body>
    <h1>Metrics Synchronizer (Local Cache Viewer)</h1>
    
    <div class="controls">
        <button id="refresh-btn">Force Sync / Refresh</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Profile / Node ID</th>
                <th>Global Net Worth</th>
                <th>Local Cache (Coins)</th>
                <th>Bank Pool</th>
                <th>Stock Nodes</th>
                <th>Last Ping</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="metrics-body">
            <tr><td colspan="7">Loading cache data...</td></tr>
        </tbody>
    </table>

    <div id="action-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Inject Node Patch</h3>
            <div class="form-group">
                <label>Mutation Type</label>
                <select id="action-type">
                    <option value="none">-- Select (Only message) --</option>
                    <option value="set_coins">Hard Override Cache (Set Coins)</option>
                    <option value="add_coins">Inject Diff (Add/Subtract Coins)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Value (Delta)</label>
                <input type="number" id="action-amount" value="0">
            </div>
            <div class="form-group">
                <label>System Broadcast Message (Optional)</label>
                <textarea id="action-msg" rows="3" placeholder="Enter message payload to broadcast to node..."></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-cancel" id="close-modal">Cancel</button>
                <button type="button" id="submit-action">Deploy Patch</button>
            </div>
        </div>
    </div>

    <script type="module" src="metrics_bundle.js"></script>
</body>
</html>
