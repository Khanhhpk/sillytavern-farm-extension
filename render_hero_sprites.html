<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hero Sprites Viewer</title>
    <style>
        body {
            background-color: #2c2538;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }
        h2 {
            border-bottom: 1px solid #5d4a85;
            padding-bottom: 10px;
        }
        .sprite-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .sprite-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #3e3250;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #5d4a85;
            width: 80px;
            text-align: center;
        }
        .sprite-item span {
            margin-top: 10px;
            font-size: 12px;
            word-wrap: break-word;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Taskbar Hero Mini Game Sprites</h1>
    
    <h2>Heroes (Pets)</h2>
    <div class="sprite-grid" id="heroes-grid"></div>

    <h2>Effects & Icons (Sprites)</h2>
    <div class="sprite-grid" id="effects-grid"></div>

    <script type="module">
        import { petSVG, spriteSVG, PETS } from './src/graphics.js';

        // All heroes defined in PETS / PET_SKILLS
        const heroes = [
            'slime', 'octo', 'slimePink', 'octoCream', 'dewSprout', 'cloudMallow', 
            'ghostBlob', 'mystery_blob', 'jellyfish', 'impBlob', 'angelBlob', 
            'prismBlob', 'starBell', 'peach_soda', 'penguin'
        ];

        const heroesGrid = document.getElementById('heroes-grid');
        heroes.forEach(id => {
            const div = document.createElement('div');
            div.className = 'sprite-item';
            div.innerHTML = petSVG(id, 64) + `<span>${id}</span>`;
            heroesGrid.appendChild(div);
        });

        // Common effects and icons used in hero.js
        const effects = [
            'emBang', 'emStar', 'emLeaf', 'emLock', 'coin', 
            'shieldFx', 'healFx', 'stunFx', 'slashFx', 'biteFx', 
            'smashFx', 'fireball', 'iceball', 'coldBreath', 'lightning', 'waterball',
            'starBolt', 'shadowBolt', 'rainbowBolt', 'leafBolt', 'arrow',
            'snowball', 'holyLight', 'heartFx', 'scytheFx', 'skullFx', 
            'sugarFx', 'bloodFx', 'dispelFx', 'blindFx', 'seedLight'
        ];

        const effectsGrid = document.getElementById('effects-grid');
        effects.forEach(id => {
            const div = document.createElement('div');
            div.className = 'sprite-item';
            div.innerHTML = spriteSVG(id, 64) + `<span>${id}</span>`;
            effectsGrid.appendChild(div);
        });
    </script>
</body>
</html>
