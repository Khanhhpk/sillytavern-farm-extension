<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; color: white; padding: 50px; font-family: sans-serif; }
  .sans-container {
    position: relative;
    width: 17px;
    height: 30px;
    transform: scale(4);
    transform-origin: top left;
    image-rendering: pixelated;
    border: 1px solid rgba(255,255,255,0.2);
    display: inline-block;
    margin-right: 50px;
  }
  .sans-container img {
    position: absolute;
  }
  #h1, #h2 { top: 0; left: 0; z-index: 3; }
  #t1 { top: 13px; left: 2px; z-index: 2; }
  #l1 { top: 22px; left: 4px; z-index: 1; }
  #t2 { top: 13px; left: 2px; z-index: 2; }
  #l2 { top: 22px; left: 2px; z-index: 1; }
  
  .controls { margin-top: 150px; display: flex; gap: 20px; }
  .controls div { border: 1px solid #555; padding: 10px; }
</style>
</head>
<body>
  <div>
    <div class="sans-container">
      <img id="l1" src="sans sprites/04_legs_side/legs_side_01.png" />
      <img id="t1" src="sans sprites/02_torso_side/torso_side_01.png" />
      <img id="h1" src="sans_head_side.png" />
    </div>
    
    <div class="sans-container">
      <img id="l2" src="sans sprites/04_legs_side/legs_side_02.png" />
      <img id="t2" src="sans sprites/02_torso_side/torso_side_02.png" />
      <img id="h2" src="sans_head_side.png" />
    </div>
  </div>
  
  <div class="controls">
    <div>
      <h4>Side 1</h4>
      Torso X: <input type="number" id="t1-x" value="2"><br>
      Torso Y: <input type="number" id="t1-y" value="13"><br>
      Legs X: <input type="number" id="l1-x" value="4"><br>
      Legs Y: <input type="number" id="l1-y" value="22"><br>
    </div>
    <div>
      <h4>Side 2</h4>
      Torso X: <input type="number" id="t2-x" value="2"><br>
      Torso Y: <input type="number" id="t2-y" value="13"><br>
      Legs X: <input type="number" id="l2-x" value="2"><br>
      Legs Y: <input type="number" id="l2-y" value="22"><br>
    </div>
  </div>
  
  <script>
    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        document.getElementById('t1').style.left = document.getElementById('t1-x').value + 'px';
        document.getElementById('t1').style.top = document.getElementById('t1-y').value + 'px';
        document.getElementById('l1').style.left = document.getElementById('l1-x').value + 'px';
        document.getElementById('l1').style.top = document.getElementById('l1-y').value + 'px';
        
        document.getElementById('t2').style.left = document.getElementById('t2-x').value + 'px';
        document.getElementById('t2').style.top = document.getElementById('t2-y').value + 'px';
        document.getElementById('l2').style.left = document.getElementById('l2-x').value + 'px';
        document.getElementById('l2').style.top = document.getElementById('l2-y').value + 'px';
      });
    });
  </script>
</body>
</html>
